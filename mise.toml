min_version = "2026.9.9"
monorepo_root = true

[monorepo]
config_roots = ["crates", "python", "packages", "java", "stacks", "stacks/*", "pulumi/aws-ec2-public"]

[vars]
python_version = "3.13.15"

[tools]
awscli = "2.36.46"
cargo-llvm-cov = "0.9.1"
dotnet = "10.0.401"
go = "1.26.6"
java = "temurin-21.0.12+101.0.LTS"
node = "22.23.2"
# Keep this in sync with packageManager in package.json.
pnpm = "10.33.0"
python = "{{ vars.python_version }}"
rust = { version = "1.95.0", profile = "minimal", components = ["rustfmt", "clippy", "llvm-tools"] }
terraform = "1.16.2"
uv = "0.12.15"

[env]
_.file = { path = ".env", optional = true }
# uv uses mise's interpreter instead of downloading a separate Python toolchain.
UV_PYTHON = "{{ vars.python_version }}"
UV_PYTHON_DOWNLOADS = "never"

[tasks.default]
description = "List all repository tasks"
run = "mise tasks --all"

[tasks.setup]
description = "Install toolchains and sync the root pnpm and uv workspaces"
run = [
  "mise install",
  { task = "//packages:install" },
  { task = "//python:install" },
]

[tasks.ci]
description = "Run each language and stack CI pipeline in order"
run = [
  { task = "//crates:ci" },
  { task = "//python:ci" },
  { task = "//packages:ci" },
  { task = "//java:ci" },
  { task = "//stacks:ci" },
]

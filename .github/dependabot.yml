version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: "main"
    labels:
      - "nodejs"
    ignore:
      # Upgrade Node types to a new major only alongside the runtime in mise.toml.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
          - "@smithy/*"
      eslint:
        patterns:
          - "*eslint*"
      modelcontextprotocol:
        patterns:
          - "@modelcontextprotocol/*"

  - package-ecosystem: "uv"
    directory: "/python"
    schedule:
      interval: "daily"
    target-branch: "main"
    labels:
      - "python"
    groups:
      aws-sdk:
        patterns:
          - "boto3"
          - "botocore"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: "main"
    labels:
      - "rust"
    groups:
      aws-sdk:
        patterns:
          - "aws-config"
          - "aws-sdk*"

  - package-ecosystem: "gradle"
    directory: "/java"
    schedule:
      interval: "daily"
    target-branch: "main"
    labels:
      - "java"

  - package-ecosystem: "gomod"
    directories:
      - "/pulumi/**/*"
    schedule:
      interval: "daily"
    target-branch: "main"
    labels:
      - "go"

  - package-ecosystem: "terraform"
    directories:
      - "/terraform/**/*"
    schedule:
      interval: "daily"
    target-branch: "main"
    labels:
      - "terraform"
    groups:
      aws:
        patterns:
          - "*aws*"

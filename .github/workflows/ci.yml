name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Install only each job's tools; task execution must not install the other
# toolchains from the shared root config. Local runs auto-install by default.
env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"

# Tool versions come from mise.toml; task definitions are shared with local runs.
jobs:
  crates:
    name: crates (Rust)
    runs-on: ubuntu-latest
    # Preserve the build settings previously supplied by setup-rust-toolchain.
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: short
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          version: "2026.9.9"
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: mise run //crates:ci

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          version: "2026.9.9"
          install_args: python uv node
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('mise.toml', 'uv.lock') }}
      - run: mise run //python:ci

  packages:
    name: packages (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          version: "2026.9.9"
          install_args: node pnpm
      - id: pnpm-cache
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('mise.toml', 'pnpm-lock.yaml') }}
      - run: mise run //packages:ci

  java:
    name: java (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          version: "2026.9.9"
          install_args: java
      - uses: gradle/actions/setup-gradle@v4
      - run: mise run //java:ci

  stacks:
    name: stacks (Terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          version: "2026.9.9"
          install_args: terraform
      - run: mise run //stacks:ci

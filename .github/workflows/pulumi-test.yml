name: Unit Test (Pulumi)

on:
  push:
  pull_request:
    branches:
      - main
      - develop
      - "release/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          version: "2026.9.9"
          install_args: go

      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('mise.toml', 'pulumi/aws-ec2-public/go.sum') }}

      - name: Run Pulumi CI tasks
        run: mise run //pulumi/aws-ec2-public:ci
